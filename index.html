<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f8fc"><title>点点贪吃蛇</title>
<style>
:root{--blue:#4776ee;--ink:#18213b;--muted:#8992aa;--paper:#f7f8fc;--line:#e7eaf2}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#fff 0,#f7f8fc 64%);color:var(--ink);font:15px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.app{width:min(100%,520px)}header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 15px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:#eaf0ff;display:grid;place-items:center;color:var(--blue);font-size:22px}.title{font-weight:800;font-size:19px;letter-spacing:-.4px}.sub{font-size:12px;color:var(--muted)}.sound{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;font-size:13px;cursor:pointer}.panel{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 48px #26365c0b;padding:16px}.topline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.select{display:flex;gap:7px}.select select{border:1px solid var(--line);border-radius:11px;background:white;padding:8px 28px 8px 10px;color:#3e4965;font:600 12px inherit;outline:none}.stats{display:flex;gap:8px}.stat{min-width:68px;background:#f6f8fc;border:1px solid #edf0f6;border-radius:12px;padding:6px 10px;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:15px}.board-wrap{position:relative;overflow:hidden;border-radius:18px;background:#fbfcff;border:1px solid #edf0f7;touch-action:none}canvas{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#f8faffca;backdrop-filter:blur(4px);transition:opacity .18s}.overlay.hidden{opacity:0;pointer-events:none}.dialog{text-align:center;padding:24px;width:88%;max-width:290px}.emoji{font-size:36px;margin-bottom:4px}.dialog h1{font-size:23px;margin:0 0 4px}.dialog p{font-size:13px;color:var(--muted);margin:0 0 18px}.primary{border:0;border-radius:13px;background:var(--blue);color:white;font:700 14px inherit;padding:12px 24px;cursor:pointer;box-shadow:0 7px 15px #4776ee35}.primary:active{transform:translateY(1px)}.below{display:flex;justify-content:space-between;align-items:center;padding:12px 3px 0;color:var(--muted);font-size:11px}.keys{display:flex;align-items:center;gap:5px}.key{padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#69748f;font-size:10px}.mobile-controls{display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px);gap:5px;justify-content:center;margin-top:12px}.mobile-controls button:active{background:#eaf0ff;color:#3567e9;transform:scale(.96)}.mobile-controls button{border:1px solid var(--line);border-radius:12px;background:#fff;color:#53617f;font-size:17px;touch-action:manipulation}.mobile-controls button:nth-child(1){grid-column:2}.mobile-controls button:nth-child(2){grid-column:1;grid-row:2}.mobile-controls button:nth-child(3){grid-column:2;grid-row:2}.mobile-controls button:nth-child(4){grid-column:3;grid-row:2}.tip{text-align:center;color:#a3abc0;font-size:11px;margin:11px 0 0}@media(max-width:560px){body{padding:12px}.panel{padding:12px;border-radius:20px}.mobile-controls{display:grid}.below{font-size:10px}.stats{gap:5px}.stat{min-width:58px;padding:5px 7px}.select select{padding:7px 21px 7px 8px;font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="app"><header><div class="brand"><div class="logo">●</div><div><div class="title">点点贪吃蛇</div><div class="sub">轻轻松松，吃掉所有小点</div></div></div><button class="sound" id="sound" aria-label="关闭音效" aria-pressed="true" title="吃到食物时会响一声；开启时可试听">🔊 音效开</button></header>
<section class="panel"><div class="topline"><div class="select"><select id="mode" aria-label="游戏模式"><option value="classic">经典 · 碰壁结束</option><option value="wrap">穿墙 · 绕到另一边</option><option value="timed">限时 · 60 秒挑战</option><option value="walls">障碍 · 小心路障</option></select><select id="speed" aria-label="速度"><option value="easy">悠闲</option><option value="normal" selected>标准</option><option value="fast">疾速</option></select></div><div class="stats"><div class="stat"><small>得分</small><b id="score">00</b></div><div class="stat"><small>最佳</small><b id="best">00</b></div><div class="stat"><small id="time-label">长度</small><b id="length">04</b></div></div></div>
<div class="board-wrap" id="board"><canvas id="game" width="420" height="420" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div class="dialog"><div class="emoji" id="emoji">🐍</div><h1 id="message">准备好了吗？</h1><p id="detail">吃到小点点，慢慢变长</p><button class="primary" id="start">开始游戏</button></div></div></div>
<div class="mobile-controls" aria-label="方向控制"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div class="below"><span id="mode-tip">撞到边缘或自己就结束</span><span class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 或方向键</span></div></section><div class="tip">空格暂停 · 手机上滑动控制方向</div></main>
<script src="game.js"></script></body></html>
